name: release

# Run it by hand and pick a version bump (the new tag is created on the selected branch), or push a
# version tag (git tag 1.2.0 && git push origin 1.2.0). Tags are semver, with or without a leading v.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump from the latest version tag (the run summary shows current → new)
        type: choice
        options: [patch, minor, major]
        default: patch

run-name: release ${{ inputs.bump || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history and tags, for the version and the commit list
      # PREV = latest version tag other than this release's, TAG = this release's
      - name: Pick the version
        env:
          BUMP: ${{ inputs.bump }}
          PUSHED: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          # "<version> <tag>" pairs, sorted by version
          prev=$(git tag -l | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | grep -vxF "${PUSHED:-none}" \
            | sed -E 's/^v?(.*)$/\1 &/' | sort -V | tail -1 | cut -d' ' -f2 || true)
          if [ -n "$PUSHED" ]; then
            tag=$PUSHED
          else
            IFS=. read -r major minor patch <<< "$(echo "${prev:-0.0.0}" | sed 's/^v//')"
            case $BUMP in
              major) tag=$((major + 1)).0.0 ;;
              minor) tag=$major.$((minor + 1)).0 ;;
              patch) tag=$major.$minor.$((patch + 1)) ;;
            esac
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then echo "tag $tag already exists"; exit 1; fi
          fi
          echo "current: ${prev:-none}, new: $tag"
          echo "### Version: ${prev:-none} → $tag" >> "$GITHUB_STEP_SUMMARY"
          { echo "PREV=$prev"; echo "TAG=$tag"; } >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build

      # Don't release a pack that fails to load
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/cache@v6
        with:
          path: /tmp/yab-ci/server.jar
          key: server-jar-33680f5f2ac32864d6d7cf5e56a705fdb3e05f4c
      - run: scripts/load-test.sh /tmp/yab-ci

      - name: Zip the packs
        run: |
          mkdir dist
          for pack in datapack resourcepack; do
            (cd .sandstone/output/$pack && zip -qr "$GITHUB_WORKSPACE/dist/yAdventures-bosses-$pack-$TAG.zip" .)
          done
      # Commits since the previous version tag (all of them for the first release); GitHub links the hashes
      - name: Write the notes
        run: |
          {
            cat .github/release-notes.md
            echo
            echo "## Commits${PREV:+ since $PREV}"
            echo
            git log --no-merges --format='- %s (%h)' ${PREV:+$PREV..}HEAD
          } > notes.md
          cat notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/*.zip --target "$GITHUB_SHA" \
            --title "yAdventures-bosses $TAG (personal use only)" \
            --notes-file notes.md --generate-notes
