name: release

# Push a tag (git tag v1.2.0 && git push origin v1.2.0), or run it by hand with a tag name
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (created on the selected branch if it doesn't exist)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build

      # Don't release a pack that fails to load
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/cache@v4
        with:
          path: /tmp/yab-ci/server.jar
          key: server-jar-33680f5f2ac32864d6d7cf5e56a705fdb3e05f4c
      - run: scripts/load-test.sh /tmp/yab-ci

      - name: Zip the packs
        run: |
          mkdir dist
          for pack in datapack resourcepack; do
            (cd .sandstone/output/$pack && zip -qr "$GITHUB_WORKSPACE/dist/yAdventures-bosses-$pack-$TAG.zip" .)
          done
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/*.zip --target "$GITHUB_SHA" \
            --title "yAdventures-bosses $TAG (personal use only)" \
            --notes-file .github/release-notes.md --generate-notes
