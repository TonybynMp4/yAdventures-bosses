name: release

# Run it by hand and pick a version bump (the new tag is created on the selected branch), or push a
# version tag (git tag 1.2.0 && git push origin 1.2.0). Tags are semver, with or without a leading v.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump from the latest version tag (the run summary shows current → new)
        type: choice
        options: [patch, minor, major]
        default: patch

run-name: release ${{ inputs.bump || github.ref_name }}

permissions:
  contents: read

jobs:
  # PREV = latest version tag other than this release's, TAG = this release's
  version:
    runs-on: ubuntu-latest
    outputs:
      prev: ${{ steps.pick.outputs.prev }}
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # all tags
      - name: Pick the version
        id: pick
        env:
          BUMP: ${{ inputs.bump }}
          PUSHED: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          # "<version> <tag>" pairs, sorted by version
          prev=$(git tag -l | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | grep -vxF "${PUSHED:-none}" \
            | sed -E 's/^v?(.*)$/\1 &/' | sort -V | tail -1 | cut -d' ' -f2 || true)
          if [ -n "$PUSHED" ]; then
            tag=$PUSHED
          else
            IFS=. read -r major minor patch <<< "$(echo "${prev:-0.0.0}" | sed 's/^v//')"
            case $BUMP in
              major) tag=$((major + 1)).0.0 ;;
              minor) tag=$major.$((minor + 1)).0 ;;
              patch) tag=$major.$minor.$((patch + 1)) ;;
            esac
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then echo "tag $tag already exists"; exit 1; fi
          fi
          echo "current: ${prev:-none}, new: $tag"
          echo "### Version: ${prev:-none} → $tag" >> "$GITHUB_STEP_SUMMARY"
          { echo "prev=$prev"; echo "tag=$tag"; } >> "$GITHUB_OUTPUT"

  # Typecheck, build and load test, the same jobs as on every push; don't release a pack that fails to load
  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.tag }}

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PREV: ${{ needs.version.outputs.prev }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history and tags, for the commit list
      - uses: actions/download-artifact@v8
        with:
          pattern: yAdventures-bosses-*pack
          path: packs
      - name: Zip the packs
        run: |
          mkdir dist
          for pack in datapack resourcepack; do
            (cd packs/yAdventures-bosses-$pack && zip -qr "$GITHUB_WORKSPACE/dist/yAdventures-bosses-$pack-$TAG.zip" .)
          done
      # Compares each pack with the previous release's zip, ignoring the version in pack.mcmeta's
      # description. An unchanged pack is republished as the previous zip, under the version it was
      # last changed in (read from its description), so the notes and the game agree on it.
      - name: Reuse unchanged packs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mcmeta() { jq -S 'del(.pack.description)' "$1/pack.mcmeta"; }
          for pack in datapack resourcepack; do
            new=packs/yAdventures-bosses-$pack old=prev/$pack since=
            # A reused zip keeps the version it was built in, so match any version
            if [ -n "$PREV" ] && gh release download "$PREV" -p "yAdventures-bosses-$pack-*.zip" -D "$old.zip.d" \
              && zip=$(ls "$old".zip.d/*.zip) && unzip -q "$zip" -d "$old" \
              && diff -rq -x pack.mcmeta "$old" "$new" && [ "$(mcmeta "$old")" = "$(mcmeta "$new")" ]; then
              since=$(jq -r .pack.description "$old/pack.mcmeta" | sed -nE 's/^yAdventures bosses ([^:]+):.*/\1/p')
              if [ -n "$since" ]; then
                rm "dist/yAdventures-bosses-$pack-$TAG.zip"
                cp "$zip" "dist/yAdventures-bosses-$pack-$since.zip"
              else
                since=$PREV # released before the version was in the description: keep the new build
              fi
            fi
            echo "$pack=$since" >> since
          done
          cat since; ls dist
      # Commits since the previous version tag (all of them for the first release); GitHub links the hashes
      - name: Write the notes
        run: |
          . ./since
          status() {
            if [ -z "$1" ]; then echo "**updated**${PREV:+ since $PREV}"
            else echo "unchanged since $1, keep the one you have"; fi
          }
          {
            cat .github/release-notes.md
            echo
            echo "## Packs in this release"
            echo
            echo "- Datapack: $(status "$datapack")"
            echo "- Resource pack: $(status "$resourcepack")"
            echo
            echo "The version is in each pack's description (the pack list in game)."
            echo
            echo "## Commits${PREV:+ since $PREV}"
            echo
            git log --no-merges --format='- %s (%h)' ${PREV:+$PREV..}HEAD
          } > notes.md
          cat notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/*.zip --target "$GITHUB_SHA" \
            --title "yAdventures-bosses $TAG (personal use only)" \
            --notes-file notes.md --generate-notes
